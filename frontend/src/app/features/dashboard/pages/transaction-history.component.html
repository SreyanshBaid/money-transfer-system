<div class="history-container">
  <!-- Header -->
  <div class="history-header">
    <h1>Transaction History</h1>
    <button class="btn btn-back" (click)="goBack()">← Back to Dashboard</button>
  </div>

  <!-- Content -->
  <div class="history-content">
    <!-- Loading State -->
    <div *ngIf="loading" class="loading-spinner">
      <p>Loading transaction history...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="alert alert-error">
      <strong>Error:</strong> {{ error }}
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && !error && transactions.length === 0" class="empty-state">
      <p>No transactions yet</p>
    </div>

    <!-- Transactions Table -->
    <div *ngIf="!loading && !error && transactions.length > 0" class="table-wrapper">
      <table class="transactions-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let transaction of transactions" [class]="getAmountClass(transaction.type)">
            <td>{{ transaction.date | dateFormat }}</td>
            <td>
              <span class="type-badge" [class.type-debit]="transaction.type === 'DEBIT'">
                {{ transaction.type }}
              </span>
            </td>
            <td class="amount">{{ transaction.amount | currencyFormat }}</td>
            <td class="description">{{ transaction.description }}</td>
            <td>
              <span class="status-badge" [class]="getStatusClass(transaction.status)">
                {{ transaction.status }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
